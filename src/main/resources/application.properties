spring.application.name=pet-guardian

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:altaria.proxy.rlwy.net}:${PGPORT:41468}/${PGDATABASE:railway}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:PpPfEBowUuHgGMRqDzZjnOZbqKlbKrZl}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator / Info
info.app.name=Pet Guardian
info.app.description=API para o projeto PetGuardian
info.app.version=1.0.0

management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=always
springdoc.swagger-ui.operationsSorter=method
spring.jpa.show-sql=true

# RSA Keys (JWT)
rsa.private-key=classpath:keys/private_key.pem
rsa.public-key=classpath:keys/public_key.pem

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Timezone
spring.jackson.time-zone=America/Sao_Paulo

spring.docker.compose.enabled=false
