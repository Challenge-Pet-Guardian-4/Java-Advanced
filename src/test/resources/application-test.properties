# Datasource (H2 em memória para testes de integração)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Desabilitar Flyway (esquema criado pelo Hibernate no perfil test)
spring.flyway.enabled=false

# JPA / DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# RSA Keys (JWT) — reutiliza as chaves reais do classpath
rsa.private-key=classpath:keys/private_key.pem
rsa.public-key=classpath:keys/public_key.pem
