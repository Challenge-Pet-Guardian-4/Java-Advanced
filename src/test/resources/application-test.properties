# Perfil de teste limpo (sem H2)
spring.flyway.enabled=false
spring.data.mongodb.auto-index-creation=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Datasource para testes - injetado via variaveis de ambiente
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# MongoDB para testes - injetado via variaveis de ambiente
spring.data.mongodb.uri=${MONGODB_URI}

# RSA Keys (JWT) — geradas dinamicamente pelo Gradle
rsa.private-key=classpath:keys/private_key.pem
rsa.public-key=classpath:keys/public_key.pem
