plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'fiap.com.br'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'com.oracle.database.jdbc:ojdbc11'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}"
    if (file('.env').exists()) {
        file('.env').eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def parts = trimmed.split('=', 2)
                environment parts[0].trim(), parts[1].trim()
            }
        }
    }
}

tasks.register('generateRsaKeys') {
    doLast {
        def mainKeysDir = file('src/main/resources/keys')
        def testKeysDir = file('src/test/resources/keys')
        mainKeysDir.mkdirs()
        testKeysDir.mkdirs()

        def privFile = file('src/main/resources/keys/private_key.pem')
        def pubFile = file('src/main/resources/keys/public_key.pem')

        if (!privFile.exists() || !pubFile.exists()) {
            def keyGen = java.security.KeyPairGenerator.getInstance("RSA")
            keyGen.initialize(2048)
            def pair = keyGen.generateKeyPair()

            def privEncoder = java.util.Base64.getMimeEncoder(64, "\r\n".getBytes())
            def privPem = "-----BEGIN PRIVATE KEY-----\r\n" + privEncoder.encodeToString(pair.getPrivate().getEncoded()) + "\r\n-----END PRIVATE KEY-----\r\n"
            def pubPem = "-----BEGIN PUBLIC KEY-----\r\n" + privEncoder.encodeToString(pair.getPublic().getEncoded()) + "\r\n-----END PUBLIC KEY-----\r\n"

            privFile.text = privPem
            pubFile.text = pubPem
            println "Chaves RSA geradas com sucesso via Gradle!"
        }

        copy {
            from mainKeysDir
            into testKeysDir
        }
    }
}

tasks.named('processResources') {
    dependsOn 'generateRsaKeys'
}

tasks.named('processTestResources') {
    dependsOn 'generateRsaKeys'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}

tasks.named('bootRun') {
    if (file('.env').exists()) {
        file('.env').eachLine { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#') && trimmed.contains('=')) {
                def parts = trimmed.split('=', 2)
                environment parts[0].trim(), parts[1].trim()
            }
        }
    }
}
