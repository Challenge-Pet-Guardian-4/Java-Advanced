plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

group = 'fiap.com.br'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    implementation 'com.oracle.database.jdbc:ojdbc11'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def loadDotEnv = {
    def envFile = file('.env')
    if (!envFile.exists()) return [:]
    envFile.readLines()
        .findAll { it.trim() && !it.trim().startsWith('#') && it.contains('=') }
        .collectEntries { def p = it.split('=', 2); [(p[0].trim()): p[1].trim()] }
}
def dotEnv = loadDotEnv()

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}"
    environment dotEnv
}

tasks.named('bootRun') {
    environment dotEnv
}

tasks.register('generateRsaKeys') {
    doLast {
        def privFile = file('src/main/resources/keys/private_key.pem')
        def pubFile = file('src/main/resources/keys/public_key.pem')

        if (!privFile.exists() || !pubFile.exists()) {
            privFile.parentFile.mkdirs()
            def pair = java.security.KeyPairGenerator.getInstance("RSA").with { initialize(2048); generateKeyPair() }
            def enc = java.util.Base64.mimeEncoder
            privFile.text = "-----BEGIN PRIVATE KEY-----\r\n" + enc.encodeToString(pair.private.encoded) + "\r\n-----END PRIVATE KEY-----\r\n"
            pubFile.text = "-----BEGIN PUBLIC KEY-----\r\n" + enc.encodeToString(pair.public.encoded) + "\r\n-----END PUBLIC KEY-----\r\n"
        }

        copy {
            from 'src/main/resources/keys'
            into 'src/test/resources/keys'
        }
    }
}

tasks.named('processResources') { dependsOn 'generateRsaKeys' }
tasks.named('processTestResources') { dependsOn 'generateRsaKeys' }

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
}
